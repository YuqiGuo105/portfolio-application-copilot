name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java service
        run: ./mvnw --batch-mode verify
      - name: Validate extension manifest and scripts
        run: |
          python3 -m json.tool extension/manifest.json >/dev/null
          node --check extension/popup/popup.js
          node --check extension/shared/mcp-client.js
          node --check extension/shared/admin-session.js
          node --check extension/content/form-scanner.js
          node --check extension/options/options.js
