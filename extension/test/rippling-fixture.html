<!doctype html>
<html>
  <head><title>Software Engineer application</title></head>
  <body>
    <header><label for="job-search">Search</label><input id="job-search" type="search"></header>
    <main>
      <h1>Job application</h1>
      <form>
        <label for="first-name">First name</label><input id="first-name" name="firstName" autocomplete="given-name" required>
        <label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" required>
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
        <label for="company">Current company</label><input id="company" name="currentCompany" required>
        <label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required>
        <label for="linkedin">LinkedIn Link</label><input id="linkedin" name="linkedinUrl" type="url">
        <label for="website">Website link</label><input id="website" name="websiteUrl" type="url">
        <input id="company-search" role="searchbox" aria-label="Search" type="text">
        <input id="anonymous-control" aria-label="textbox" type="text">
        <select id="anonymous-select" aria-label="Select..."><option>Select...</option></select>
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
