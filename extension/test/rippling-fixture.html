<!doctype html>
<html>
  <head><title>Software Engineer application</title></head>
  <body>
    <header><label for="job-search">Search</label><input id="job-search" type="search"></header>
    <main>
      <h1>Job application</h1>
      <form>
        <label for="resume">Résumé</label><input id="resume" type="file" accept="application/pdf" required hidden>
        <label for="first-name">First name</label><input id="first-name" name="firstName" autocomplete="given-name" required>
        <label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" required>
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
        <label for="company">Current company</label><input id="company" name="currentCompany" required>
        <label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required>
        <label for="linkedin">LinkedIn Link</label><input id="linkedin" name="linkedinUrl" type="url">
        <label for="website">Website link</label><input id="website" name="websiteUrl" type="url">
        <div class="field" data-field>
          <label id="location-label">Location</label>
          <input id="location" role="combobox" aria-labelledby="location-label" aria-controls="location-options" aria-required="true">
          <div id="location-options" role="listbox" hidden>
            <button type="button" role="option">Salt Lake City, UT, United States</button>
          </div>
        </div>
        <label for="cover-letter">Cover letter</label><input id="cover-letter" type="file" accept="application/pdf">
        <input id="company-search" role="searchbox" aria-label="Search" type="text">
        <input id="anonymous-control" aria-label="textbox" type="text">
        <select id="anonymous-select" aria-label="Select..."><option>Select...</option></select>
        <div class="field" data-field>
          <label id="gender-label">Gender</label>
          <button id="gender" type="button" role="combobox" aria-labelledby="gender-label" aria-controls="gender-options" aria-required="true">Select...</button>
          <div id="gender-options" role="listbox" hidden>
            <div><span>Male</span></div>
            <div><span>Female</span></div>
            <div><span>Choose not to disclose</span></div>
          </div>
        </div>
        <section class="eeo-question">
          <h3>Please identify your race</h3>
          <div><div id="race" aria-label="Select..."><span>Select...</span></div></div>
          <div id="race-options" role="listbox" hidden>
            <div><span>Asian</span></div>
            <div><span>White</span></div>
            <div><span>Choose not to disclose</span></div>
          </div>
        </section>
        <div class="field" data-field>
          <label id="hispanic-label">Are you Hispanic/Latino?</label>
          <button id="hispanic" type="button" role="combobox" aria-labelledby="hispanic-label" aria-controls="hispanic-options">Select...</button>
          <div id="hispanic-options" role="listbox" hidden>
            <div><span>Yes</span></div>
            <div><span>No</span></div>
            <div><span>Choose not to disclose</span></div>
          </div>
        </div>
        <section class="sms-question">
          <p>Check Yes or No to indicate your agreement to receive text message updates from Rippling regarding your job application.</p>
          <label><input type="radio" name="smsConsent" value="yes">Yes - I consent to receiving text messages</label>
          <label><input type="radio" name="smsConsent" value="no">No - I do not consent to receiving text messages</label>
        </section>
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
