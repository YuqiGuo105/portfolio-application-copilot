<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Application Copilot settings</title></head>
  <body style="font-family:system-ui;max-width:680px;margin:48px auto;padding:0 20px">
    <h1>Application Copilot settings</h1>
    <p>The extension authenticates through the existing yuqi.site admin session. It does not store a password.</p>

    <input id="endpoint" style="display:block;width:100%;margin:8px 0 14px;padding:10px" value="https://www.yuqi.site/mcp/admin">
    <button id="save" style="padding:10px 18px">Save</button>
    <span id="status" style="margin-left:10px"></span>
    <script type="module" src="options.js"></script>
  </body>
</html>
